name: Build HEY-W09 Kubuntu Linux (官方4.19)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang-14 lld-14 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            flex bison bc cpio xz-utils zstd bzip2 \
            libssl-dev libncurses-dev \
            device-tree-compiler \
            mkbootimg debootstrap qemu-user-static e2fsprogs zip \
            busybox-static dpkg-dev wget p7zip-full
          # debootstrap 认识 Debian bookworm 发行版代号
          sudo ln -sf /usr/share/debootstrap/scripts/sid /usr/share/debootstrap/scripts/bookworm 2>/dev/null || true
      - name: Restore kernel build cache
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: |
            out/kernel
            out/modules-stage
          key: hey-w09-k419-clang-${{ hashFiles('scripts/build-kernel-official.sh', 'scripts/patch-vendor-419.sh') }}

      - name: Fetch official 4.19 kernel source
        run: bash scripts/fetch-kernel-official.sh

      - name: Build ARM64 kernel (clang)
        run: bash scripts/build-kernel-official.sh

      - name: Save kernel build cache
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/kernel
            out/modules-stage
          key: hey-w09-k419-clang-${{ hashFiles('scripts/build-kernel-official.sh', 'scripts/patch-vendor-419.sh') }}

      - name: Build Kubuntu arm64 rootfs (KDE Plasma + Firefox)
        run: bash scripts/build-rootfs.sh

      - name: Build initramfs (busybox + init + WiFi)
        run: bash scripts/build-initramfs.sh

      - name: Build boot.img
        run: bash scripts/build-bootimg.sh

      - name: Assemble & compress release
        run: bash scripts/assemble.sh

      - name: Build flashable zip (TWRP 卡刷包)
        run: bash scripts/build-flashable.sh

      - name: Build 9008 EDL 线刷包
        run: bash scripts/build-edl.sh

      - name: Show output tree
        run: find out -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Prepare release assets (权限修复 + 精简中间大文件)
        run: |
          sudo chmod -R a+rX out/rootfs out/flashable out/kernel out/initrd 2>/dev/null || true
          # 精简中间大文件 (root-owned 需 sudo; 全部容错, 不阻断上传)
          sudo rm -f out/rootfs.img out/rootfs.tar.xz out/flashable/rootfs.img 2>/dev/null || true
          sudo rm -rf out/rootfs 2>/dev/null || true
          ls -lh out/*.zip out/*.img out/boot.img 2>/dev/null || true
      - name: Upload artifacts (小文件)
        uses: actions/upload-artifact@v4
        with:
          name: hey-w09-assets
          path: |
            out/boot.img
            out/hey-w09-flashable.zip
            out/hey-w09-edl.zip
          if-no-files-found: error
          retention-days: 14
      - name: Split large zips into <2GB volumes (Release 单文件上限2GB)
        run: |
          mkdir -p out/split
          for f in out/hey-w09-flashable.zip out/hey-w09-edl.zip; do
            base=$(basename "$f")
            echo ">> splitting $f ..."
            split -b 1800M -d -a 3 "$f" "out/split/${base}."
            rm -f "$f"
          done
          cat > out/split/MERGE.txt <<'EOF'
          ============================================
           HOW TO MERGE SPLIT VOLUMES (合并分卷方法)
          ============================================
          Each large file was split into 1800MB volumes (<2GB, GitHub Release limit).
          Download ALL volumes of the same name (e.g. hey-w09-flashable.zip.000/.001/.002)
          into one folder, then merge:

          [Linux / macOS]
            cat hey-w09-flashable.zip.0* > hey-w09-flashable.zip
            cat hey-w09-edl.zip.0* > hey-w09-edl.zip

          [Windows (cmd)]
            copy /b hey-w09-flashable.zip.000 + hey-w09-flashable.zip.001 + hey-w09-flashable.zip.002 hey-w09-flashable.zip
            copy /b hey-w09-edl.zip.000 + hey-w09-edl.zip.001 + hey-w09-edl.zip.002 hey-w09-edl.zip

          (Use the exact volume names you downloaded; 003/... if more volumes exist.)
          Then verify with: sha256sum <file> (or certutil -hashfile <file> SHA256 on Windows)
          Boot.img is a single small file, no merging needed.
          ============================================
          EOF
          ls -lh out/split/
      - name: Publish GitHub Release (分卷, 每卷<2GB 可免登录下载)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d.%H%M)"
          gh release list --limit 20 | tail -n +4 | cut -f1 | xargs -r -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
          NOTES="基于荣耀官方4.19内核 + Kubuntu 24.04 (KDE Plasma+Firefox+apt/dpkg)。\n- hey-w09-flashable.zip: TWRP/橙狐 卡刷包 (拆分为 .000/.001/.002 分卷, 下载全部后按 MERGE.txt 合并)\n- hey-w09-edl.zip: 9008(EDL)线刷包 (同上分卷; rawprogram0.xml 偏移需按设备GPT校准)\n- boot.img: 官方4.19内核 + busybox initrd (fastboot flash boot)\n- MERGE.txt: 分卷合并说明\n登录: root/debian。"
          gh release create "$TAG" \
            out/boot.img out/split/MERGE.txt \
            $(ls out/split/*.zip.0* 2>/dev/null | sort) \
            --repo ${GITHUB_REPOSITORY} --title "HEY-W09 Kubuntu Linux (官方4.19) $TAG" --notes "$NOTES" || true