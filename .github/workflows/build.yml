name: Build HEY-W09 Debian Linux (官方4.19)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang-14 lld-14 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            flex bison bc cpio xz-utils zstd bzip2 \
            libssl-dev libncurses-dev \
            device-tree-compiler \
            mkbootimg debootstrap qemu-user-static e2fsprogs zip \
            busybox-static dpkg-dev wget p7zip-full
          # debootstrap 认识 Debian bookworm 发行版代号
          sudo ln -sf /usr/share/debootstrap/scripts/sid /usr/share/debootstrap/scripts/bookworm 2>/dev/null || true
      - name: Restore kernel build cache
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: |
            out/kernel
            out/modules-stage
          key: hey-w09-k419-clang-${{ hashFiles('scripts/build-kernel-official.sh', 'scripts/patch-vendor-419.sh') }}

      - name: Fetch official 4.19 kernel source
        run: bash scripts/fetch-kernel-official.sh

      - name: Build ARM64 kernel (clang)
        run: bash scripts/build-kernel-official.sh

      - name: Save kernel build cache
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/kernel
            out/modules-stage
          key: hey-w09-k419-clang-${{ hashFiles('scripts/build-kernel-official.sh', 'scripts/patch-vendor-419.sh') }}

      - name: Build Debian arm64 rootfs (GNOME + Firefox)
        run: bash scripts/build-rootfs.sh

      - name: Build initramfs (busybox + init + WiFi)
        run: bash scripts/build-initramfs.sh

      - name: Build boot.img
        run: bash scripts/build-bootimg.sh

      - name: Assemble & compress release
        run: bash scripts/assemble.sh

      - name: Build flashable zip (TWRP 卡刷包)
        run: bash scripts/build-flashable.sh

      - name: Build 9008 EDL 线刷包
        run: bash scripts/build-edl.sh

      - name: Build Limbo rootfs 磁盘镜像
        run: bash scripts/build-limbo.sh

      - name: Show output tree
        run: find out -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Prepare release assets (权限修复 + 精简中间大文件)
        run: |
          sudo chmod -R a+rX out/rootfs out/flashable out/kernel out/initrd 2>/dev/null || true
          rm -f out/rootfs.img out/hey-w09-limbo.img out/rootfs.tar.xz out/flashable/rootfs.img
          rm -rf out/rootfs
          ls -lh out/*.zip out/*.img out/boot.img 2>/dev/null || true
      - name: Upload artifacts (小文件)
        uses: actions/upload-artifact@v4
        with:
          name: hey-w09-assets
          path: |
            out/boot.img
            out/hey-w09-flashable.zip
            out/hey-w09-edl.zip
            out/hey-w09-limbo.zip
            out/README-LIMBO.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release (大文件, 2GB/文件)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d.%H%M)"
          gh release list --limit 20 | tail -n +4 | cut -f1 | xargs -r -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
          NOTES="基于荣耀官方4.19内核 + Debian bookworm(GNOME+Firefox+apt/dpkg)。\n- hey-w09-flashable.zip: TWRP/橙狐 卡刷包\n- hey-w09-edl.zip: 9008(EDL)线刷包(rawprogram0.xml 偏移需按设备GPT校准)\n- hey-w09-limbo.zip: Limbo(QEMU)可引导 rootfs 磁盘镜像 + 配置说明\n- boot.img: 官方4.19内核 + busybox initrd (fastboot flash boot)\n登录: root/debian。"
          gh release create "$TAG" \
            out/boot.img out/hey-w09-flashable.zip out/hey-w09-edl.zip out/hey-w09-limbo.zip \
            --repo ${GITHUB_REPOSITORY} --title "HEY-W09 Debian Linux (官方4.19) $TAG" --notes "$NOTES" || true