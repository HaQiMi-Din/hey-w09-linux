name: Build GhostLock for HEY-W09
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y pahole binutils git wget unzip p7zip-full make gcc-aarch64-linux-gnu libelf-dev dwarves tree

      - name: Setup NDK r27d (cached)
        uses: Ylarod/setup-ndk-clang@v1
        with:
          ndk-version: r27d
        id: ndk
      - name: Export NDK env
        run: echo "NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract kernel source (7z)
        run: 7z x kernel-source.rar -okernel-src -y

      # 新增：打印目录结构，排查嵌套文件夹
      - name: Show extracted file tree
        run: tree -L 3 kernel-src

      - name: Build vmlinux with DWARF debug info
        working-directory: ./kernel-src
        run: |
          ls -l arch/arm64/configs/
          ls -l vendor/ 2>/dev/null || echo "vendor folder not exists!"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bengal_defconfig
          scripts/config --set-val DEBUG_INFO y
          scripts/config --set-val DEBUG_INFO_DWARF4 y
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux

      - name: Dump struct offsets with pahole
        working-directory: ./kernel-src
        run: |
          pahole -C task_struct vmlinux > ../task_struct.txt
          pahole -C cred vmlinux > ../cred.txt
          pahole -C rt_mutex_waiter vmlinux > ../rt_mutex_waiter.txt
          nm vmlinux | grep -E "init_task|init_cred" > ../kallsyms.txt

      - name: Clone GhostLock with ghproxy accelerate
        run: git clone https://mirror.ghproxy.com/https://github.com/p2p3p/GhostLock-for-OnePlus.git ghostlock

      - name: Create device directory & generate offsets.h template
        run: |
          mkdir -p ghostlock/src/devices/hey_w09
          cat > ghostlock/src/devices/hey_w09/offsets.h <<'EOF'
          /* Auto-generated for HEY-W09 SM6225 4.19 */
          #ifndef __OFFSETS_HEY_W09_H__
          #define __OFFSETS_HEY_W09_H__
          // Need manually fill values from exported txt files
          #define KIMAGE_TEXT_BASE         0xffffffc008000000ULL
          #define P0_PAGE_OFFSET           0xffffffc000000000ULL
          #endif
          EOF

      - name: Compile ghostlock exp binary
        working-directory: ./ghostlock
        run: |
          export NDK_ROOT=${{ env.NDK_ROOT }}
          mkdir -p build/bin
          make clean
          make TARGET_DEVICE=hey_w09

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hey-w09-ghostlock-output
          path: |
            ghostlock/build/bin/ghostlock
            *.txt
